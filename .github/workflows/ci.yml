name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}

  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Build setup app
        run: npm run build

      - name: Run tests
        run: npm test

  share-zip:
    name: Build and smoke-test Windows share zip
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build share zip
        shell: powershell
        run: scripts\make-share-zip.ps1 -Python "${{ steps.python.outputs.python-path }}"

      - name: Smoke-test share zip
        shell: powershell
        run: scripts\smoke-test-share-zip.ps1

      - name: Upload share zip
        uses: actions/upload-artifact@v4
        with:
          name: video-switcher-windows
          path: dist/Video Switcher.zip
          retention-days: 3
          compression-level: 0
